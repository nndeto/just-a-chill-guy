<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/images/favicon_game/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&family=VT323&family=Rowdies:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <title>Just A Chill Guy</title>
</head>
<body>
    <div class = "stats">
        <p id = "luck"></p>
        <p id = "jump"></p>
        <p id = "swim"></p>
        <p id = "points"></p>
    </div>
    <div class = "storybook">
        <div id = "static-intro">
            <h1 id ="h1">Hey there, just a chill guy!</h1>
            <p id = "intro-text" class = "intro-text">You are a hero on a quest. For what? You don't quite remember. Get started to see if you can figure it out.</p>
            <button id="start-button" class = "button">Start Quest</button>
        </div>
        <div id = "game-play">
            <p id = "story-text" class = "story-text"></p>
            <div id ="choice-buttons">
            </div>
        </div>
    </div>
    <div class = "picturebook" id ="star-overlay">
    </div>
</body>
</html>
